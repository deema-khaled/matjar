# Local development:   docker compose up -d                  -> MySQL only
# Whole app in Docker: docker compose --profile app up -d --build
#                      -> http://localhost:8001 (change with APP_PORT)

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-production}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_URL: http://localhost:${APP_PORT:-8001}
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  LOG_CHANNEL: stderr

services:
  mysql:
    image: mysql:8.4
    container_name: matjar_db
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-matjar}
      MYSQL_USER: ${DB_USERNAME:-matjar}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    profiles: [app]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: app
    image: matjar-app
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-env
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    volumes:
      - uploads:/var/www/html/storage/app/public
    depends_on:
      mysql: { condition: service_healthy }

  web:
    profiles: [app]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8001}:80"
    volumes:
      - uploads:/var/www/html/public/storage:ro
    depends_on:
      - app

volumes:
  mysqldata:
  uploads:
